appId: ${APP_ID}
tags:
  - util
---
- runFlow:
    when:
      visible: 'React Native Template'
    file: onboarding.yaml
# After onboarding, tap "I have an account" to go to sign-in
- runFlow:
    when:
      visible: 'I have an account'
    commands:
      - tapOn: 'I have an account'
- runFlow:
    when:
      visible: 'Sign In'
    file: login.yaml
